<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- alternating plank rows -->
  <rect x="0"  y="0"  width="40" height="10" fill="#d97706"/>
  <rect x="0"  y="10" width="40" height="10" fill="#b45309"/>
  <rect x="0"  y="20" width="40" height="10" fill="#d97706"/>
  <rect x="0"  y="30" width="40" height="10" fill="#b45309"/>
  <!-- row borders -->
  <line x1="0" y1="10" x2="40" y2="10" stroke="#92400e" stroke-width="0.8"/>
  <line x1="0" y1="20" x2="40" y2="20" stroke="#92400e" stroke-width="0.8"/>
  <line x1="0" y1="30" x2="40" y2="30" stroke="#92400e" stroke-width="0.8"/>
  <!-- staggered vertical plank joints -->
  <line x1="13" y1="0"  x2="13" y2="10" stroke="#92400e" stroke-width="0.6"/>
  <line x1="26" y1="0"  x2="26" y2="10" stroke="#92400e" stroke-width="0.6"/>
  <line x1="7"  y1="10" x2="7"  y2="20" stroke="#92400e" stroke-width="0.6"/>
  <line x1="20" y1="10" x2="20" y2="20" stroke="#92400e" stroke-width="0.6"/>
  <line x1="33" y1="10" x2="33" y2="20" stroke="#92400e" stroke-width="0.6"/>
  <line x1="13" y1="20" x2="13" y2="30" stroke="#92400e" stroke-width="0.6"/>
  <line x1="26" y1="20" x2="26" y2="30" stroke="#92400e" stroke-width="0.6"/>
  <line x1="7"  y1="30" x2="7"  y2="40" stroke="#92400e" stroke-width="0.6"/>
  <line x1="20" y1="30" x2="20" y2="40" stroke="#92400e" stroke-width="0.6"/>
  <line x1="33" y1="30" x2="33" y2="40" stroke="#92400e" stroke-width="0.6"/>
</svg>
