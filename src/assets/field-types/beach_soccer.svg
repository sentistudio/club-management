<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Beachsoccer-Platz – sandy surface with beach feel -->
  <!-- Sand base -->
  <rect width="120" height="80" fill="#fbbf24" rx="4"/>
  <!-- Sand texture – subtle grain -->
  <circle cx="12" cy="12" r="1" fill="#f59e0b" opacity="0.6"/>
  <circle cx="28" cy="7" r="0.8" fill="#f59e0b" opacity="0.5"/>
  <circle cx="48" cy="14" r="1" fill="#d97706" opacity="0.4"/>
  <circle cx="65" cy="6" r="0.8" fill="#f59e0b" opacity="0.6"/>
  <circle cx="82" cy="11" r="1" fill="#d97706" opacity="0.5"/>
  <circle cx="100" cy="8" r="0.8" fill="#f59e0b" opacity="0.4"/>
  <circle cx="115" cy="15" r="1" fill="#d97706" opacity="0.6"/>
  <circle cx="8" cy="30" r="0.8" fill="#d97706" opacity="0.5"/>
  <circle cx="22" cy="38" r="1" fill="#f59e0b" opacity="0.4"/>
  <circle cx="42" cy="32" r="0.8" fill="#f59e0b" opacity="0.6"/>
  <circle cx="70" cy="35" r="1" fill="#d97706" opacity="0.4"/>
  <circle cx="90" cy="28" r="0.8" fill="#f59e0b" opacity="0.5"/>
  <circle cx="108" cy="36" r="1" fill="#d97706" opacity="0.6"/>
  <circle cx="18" cy="55" r="1" fill="#f59e0b" opacity="0.5"/>
  <circle cx="38" cy="62" r="0.8" fill="#d97706" opacity="0.4"/>
  <circle cx="55" cy="58" r="1" fill="#f59e0b" opacity="0.6"/>
  <circle cx="78" cy="65" r="0.8" fill="#d97706" opacity="0.5"/>
  <circle cx="98" cy="60" r="1" fill="#f59e0b" opacity="0.4"/>
  <circle cx="112" cy="70" r="0.8" fill="#d97706" opacity="0.6"/>
  <!-- Wave hint at bottom -->
  <path d="M0 72 Q30 68 60 72 Q90 76 120 72" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <path d="M0 78 Q30 74 60 78 Q90 82 120 78" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <!-- Field lines (white posts on beach) -->
  <rect x="6" y="6" width="108" height="62" fill="none" stroke="white" stroke-width="2" rx="1"/>
  <line x1="60" y1="6" x2="60" y2="68" stroke="white" stroke-width="1.5"/>
  <circle cx="60" cy="37" r="11" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Goals -->
  <rect x="6" y="24" width="5" height="20" fill="none" stroke="white" stroke-width="1.5"/>
  <rect x="109" y="24" width="5" height="20" fill="none" stroke="white" stroke-width="1.5"/>
</svg>
