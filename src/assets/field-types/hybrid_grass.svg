<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Hybridrasenplatz – half natural grass, half artificial turf -->
  <!-- Left half: natural grass -->
  <rect x="0" y="0" width="60" height="80" fill="#16a34a" rx="4"/>
  <!-- Right half: artificial turf (brighter green) -->
  <rect x="60" y="0" width="60" height="80" fill="#22c55e" rx="4"/>
  <!-- Grass texture on natural side -->
  <line x1="10" y1="0" x2="10" y2="80" stroke="#15803d" stroke-width="1" opacity="0.4"/>
  <line x1="20" y1="0" x2="20" y2="80" stroke="#15803d" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="0" x2="30" y2="80" stroke="#15803d" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="0" x2="40" y2="80" stroke="#15803d" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="0" x2="50" y2="80" stroke="#15803d" stroke-width="1" opacity="0.4"/>
  <!-- Artificial pattern on right side (horizontal lines) -->
  <line x1="60" y1="10" x2="120" y2="10" stroke="#16a34a" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="20" x2="120" y2="20" stroke="#16a34a" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="30" x2="120" y2="30" stroke="#16a34a" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="40" x2="120" y2="40" stroke="#16a34a" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="50" x2="120" y2="50" stroke="#16a34a" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="60" x2="120" y2="60" stroke="#16a34a" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="70" x2="120" y2="70" stroke="#16a34a" stroke-width="1.5" opacity="0.5"/>
  <!-- Center dividing seam -->
  <line x1="60" y1="0" x2="60" y2="80" stroke="#d4d4d4" stroke-width="1" opacity="0.7" stroke-dasharray="4,3"/>
  <!-- Field lines -->
  <rect x="6" y="6" width="108" height="68" fill="none" stroke="white" stroke-width="2" rx="1"/>
  <line x1="60" y1="6" x2="60" y2="74" stroke="white" stroke-width="1.5"/>
  <circle cx="60" cy="40" r="12" fill="none" stroke="white" stroke-width="1.5"/>
</svg>
