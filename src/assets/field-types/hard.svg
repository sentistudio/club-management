<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- Hartplatz – grey asphalt/gravel surface -->
  <rect width="120" height="80" fill="#9ca3af" rx="4"/>
  <!-- Surface texture grid -->
  <line x1="0" y1="20" x2="120" y2="20" stroke="#6b7280" stroke-width="0.8" opacity="0.6"/>
  <line x1="0" y1="40" x2="120" y2="40" stroke="#6b7280" stroke-width="0.8" opacity="0.6"/>
  <line x1="0" y1="60" x2="120" y2="60" stroke="#6b7280" stroke-width="0.8" opacity="0.6"/>
  <line x1="30" y1="0" x2="30" y2="80" stroke="#6b7280" stroke-width="0.8" opacity="0.6"/>
  <line x1="60" y1="0" x2="60" y2="80" stroke="#6b7280" stroke-width="0.8" opacity="0.6"/>
  <line x1="90" y1="0" x2="90" y2="80" stroke="#6b7280" stroke-width="0.8" opacity="0.6"/>
  <!-- Field lines -->
  <rect x="6" y="6" width="108" height="68" fill="none" stroke="white" stroke-width="2" rx="1"/>
  <line x1="60" y1="6" x2="60" y2="74" stroke="white" stroke-width="1.5"/>
  <circle cx="60" cy="40" r="12" fill="none" stroke="white" stroke-width="1.5"/>
</svg>
